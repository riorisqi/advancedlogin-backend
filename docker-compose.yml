# Local dev infrastructure. Start with: docker compose up -d
# Ports are bound to 127.0.0.1 only: nothing else on your network (e.g. while using
# `bun run dev:lan`) can reach Redis or RedisInsight.
services:
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    # No persistence: QR and HTTP sessions are short-lived anyway.
    # Dev password; override with REDIS_PASSWORD (the backend reads the same variable).
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--requirepass", "${REDIS_PASSWORD:-advancedlogin-dev}"]

  # Web UI for keys and TTLs: http://localhost:5540
  # (add a database: host "redis", port 6379, password as above)
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis
