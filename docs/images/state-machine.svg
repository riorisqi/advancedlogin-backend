<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">QR session state machine</text>

  <!-- start -->
  <circle cx="45" cy="125" r="9" fill="#0f172a"/>
  <line x1="55" y1="125" x2="88" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="45" y="155" text-anchor="middle" font-size="11" fill="#475569">desktop</text>
  <text x="45" y="169" text-anchor="middle" font-size="11" fill="#475569">creates</text>

  <!-- active states -->
  <rect x="90" y="95" width="130" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">PENDING</text>
  <text x="155" y="141" text-anchor="middle" font-size="11" fill="#475569">TTL 90s</text>

  <rect x="320" y="95" width="130" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">SCANNED</text>
  <text x="385" y="141" text-anchor="middle" font-size="11" fill="#475569">TTL 60s · locked to user</text>

  <rect x="550" y="95" width="130" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">CONFIRMED</text>
  <text x="615" y="141" text-anchor="middle" font-size="11" fill="#475569">TTL 30s · code issued</text>

  <!-- terminal states -->
  <rect x="780" y="95" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="784" y="99" width="122" height="52" rx="7" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="845" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CONSUMED</text>
  <text x="845" y="141" text-anchor="middle" font-size="11" fill="#16a34a">logged in ✓</text>

  <rect x="320" y="270" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="324" y="274" width="122" height="52" rx="7" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="385" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">REJECTED</text>
  <text x="385" y="316" text-anchor="middle" font-size="11" fill="#475569">kept 15s</text>

  <rect x="620" y="270" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="624" y="274" width="122" height="52" rx="7" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="685" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">EXPIRED</text>
  <text x="685" y="316" text-anchor="middle" font-size="11" fill="#475569">Redis key gone</text>

  <!-- happy path -->
  <line x1="222" y1="125" x2="317" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="101" text-anchor="middle" font-size="12" fill="#334155">phone scans</text>
  <text x="270" y="115" text-anchor="middle" font-size="11" fill="#64748b">(authenticated)</text>
  <line x1="452" y1="125" x2="547" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="101" text-anchor="middle" font-size="12" fill="#334155">same user</text>
  <text x="500" y="115" text-anchor="middle" font-size="12" fill="#334155">approves</text>
  <line x1="682" y1="125" x2="777" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="730" y="101" text-anchor="middle" font-size="12" fill="#334155">desktop</text>
  <text x="730" y="115" text-anchor="middle" font-size="12" fill="#334155">exchanges code</text>

  <!-- reject -->
  <line x1="385" y1="157" x2="385" y2="267" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="377" y="245" text-anchor="end" font-size="12" fill="#b91c1c">user declines</text>

  <!-- expiry -->
  <line x1="175" y1="157" x2="622" y2="272" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="250" y="200" text-anchor="end" font-size="12" fill="#64748b">TTL ends</text>
  <line x1="430" y1="157" x2="650" y2="268" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="560" y="205" font-size="12" fill="#64748b">TTL ends</text>
  <line x1="640" y1="157" x2="690" y2="267" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="680" y="195" font-size="12" fill="#64748b">code not redeemed</text>

  <!-- legend -->
  <rect x="30" y="372" width="900" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="46" y="384" width="18" height="16" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="72" y="397" font-size="12" fill="#475569">active state</text>
  <rect x="160" y="384" width="18" height="16" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="186" y="397" font-size="12" fill="#475569">terminal state</text>
  <text x="300" y="397" font-size="12" fill="#334155">Every arrow is one atomic Lua compare-and-set in Redis: “move to X only if currently Y”.</text>
</svg>
