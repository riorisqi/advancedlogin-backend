<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" width="1020" height="510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>QR session state machine</title>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    .n { font-size: 17px; font-weight: 700; }
    .d { font-size: 12.5px; fill: #334155; }
    .l { font-size: 12.5px; fill: #1e293b; }
    .m { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #475569; }
    .g { font-size: 12px; fill: #64748b; }
  </style>

  <rect x="1" y="1" width="1018" height="508" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">QR session state machine</text>
  <text x="30" y="64" font-size="13" fill="#64748b">Each arrow is one atomic Lua compare-and-set in Redis: "move to X only if the status is still Y". The domain (QrSession) decides; Redis enforces.</text>

  <!-- start -->
  <circle cx="42" cy="170" r="9" fill="#0f172a"/>
  <path d="M51 170 L76 170" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <text x="30" y="226" class="g">desktop</text>
  <text x="30" y="242" class="m">POST /api/qr/</text>
  <text x="30" y="256" class="m">sessions</text>

  <!-- states -->
  <rect x="80" y="133" width="160" height="74" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="161" class="n" text-anchor="middle" fill="#92400e">PENDING</text>
  <text x="160" y="181" class="d" text-anchor="middle">TTL 90 s</text>
  <text x="160" y="197" class="d" text-anchor="middle">QR shown on desktop</text>

  <rect x="330" y="133" width="160" height="74" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="161" class="n" text-anchor="middle" fill="#1e40af">SCANNED</text>
  <text x="410" y="181" class="d" text-anchor="middle">TTL 60 s</text>
  <text x="410" y="197" class="d" text-anchor="middle">locked to the scanner</text>

  <rect x="580" y="133" width="160" height="74" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="660" y="161" class="n" text-anchor="middle" fill="#166534">CONFIRMED</text>
  <text x="660" y="181" class="d" text-anchor="middle">TTL 30 s</text>
  <text x="660" y="197" class="d" text-anchor="middle">exchange code issued</text>

  <rect x="830" y="133" width="160" height="74" rx="14" fill="#166534" stroke="#166534" stroke-width="2"/>
  <rect x="835" y="138" width="150" height="64" rx="11" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="910" y="161" class="n" text-anchor="middle" fill="#ffffff">CONSUMED</text>
  <text x="910" y="181" class="d" text-anchor="middle" style="fill:#dcfce7">kept 15 s</text>
  <text x="910" y="197" class="d" text-anchor="middle" style="fill:#dcfce7">desktop signed in ✓</text>

  <rect x="330" y="300" width="160" height="74" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="335" y="305" width="150" height="64" rx="11" fill="none" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="328" class="n" text-anchor="middle" fill="#991b1b">REJECTED</text>
  <text x="410" y="348" class="d" text-anchor="middle">kept 15 s</text>
  <text x="410" y="364" class="d" text-anchor="middle">"Login declined"</text>

  <rect x="580" y="300" width="200" height="74" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="585" y="305" width="190" height="64" rx="11" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="680" y="328" class="n" text-anchor="middle" fill="#334155">EXPIRED</text>
  <text x="680" y="348" class="d" text-anchor="middle">Redis key is gone</text>
  <text x="680" y="364" class="d" text-anchor="middle">API answers 404</text>

  <!-- main path -->
  <path d="M240 170 L326 170" stroke="#334155" stroke-width="2.2" marker-end="url(#ad)"/>
  <text x="285" y="110" class="l" text-anchor="middle">phone scans</text>
  <text x="285" y="125" class="m" text-anchor="middle">POST …/scan</text>

  <path d="M490 170 L576 170" stroke="#334155" stroke-width="2.2" marker-end="url(#ad)"/>
  <text x="535" y="110" class="l" text-anchor="middle">same user approves</text>
  <text x="535" y="125" class="m" text-anchor="middle">POST …/approve</text>

  <path d="M740 170 L826 170" stroke="#334155" stroke-width="2.2" marker-end="url(#ad)"/>
  <text x="785" y="110" class="l" text-anchor="middle">desktop redeems code</text>
  <text x="785" y="125" class="m" text-anchor="middle">POST …/exchange</text>

  <!-- re-scan loop -->
  <path d="M385 133 C 385 96, 435 96, 435 129" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ad)"/>
  <text x="410" y="88" class="g" text-anchor="middle">same user scans again: no change</text>

  <!-- reject -->
  <path d="M380 207 L380 296" stroke="#334155" stroke-width="2.2" marker-end="url(#ad)"/>
  <text x="370" y="246" class="l" text-anchor="end">user declines</text>
  <text x="370" y="261" class="m" text-anchor="end">POST …/reject</text>

  <!-- expiry -->
  <path d="M160 207 L160 420 L680 420 L680 378" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="170" y="412" class="g">TTL ends: nobody scanned (desktop auto-refreshes the QR up to 3×)</text>
  <path d="M470 207 L470 252 L620 252 L620 296" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="500" y="244" class="g">TTL ends: no decision</text>
  <path d="M700 207 L700 296" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="710" y="252" class="g">TTL ends: code never redeemed</text>

  <!-- legend -->
  <g transform="translate(30 462)" font-size="12.5" fill="#334155">
    <rect x="0" y="-12" width="26" height="18" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="2">active state (new TTL on every move)</text>
    <rect x="270" y="-12" width="26" height="18" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="273" y="-9" width="20" height="12" rx="3" fill="none" stroke="#94a3b8"/>
    <text x="304" y="2">terminal state (stream closes)</text>
    <path d="M520 -3 h30" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
    <text x="558" y="2">request</text>
    <path d="M620 -3 h30" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
    <text x="658" y="2">time runs out</text>
    <text x="760" y="2" fill="#64748b">Other users → 409 · unknown id → 404</text>
  </g>
</svg>
