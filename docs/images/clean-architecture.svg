<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Clean architecture rings, backend and frontend</title>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
  </defs>
  <style>
    .rl { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
    .re { font-size: 11.5px; fill: #334155; text-anchor: middle; }
    .hd { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .ft { font-size: 12.5px; fill: #334155; text-anchor: middle; }
    .fm { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #0f172a; }
  </style>

  <rect x="1" y="1" width="1038" height="638" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">Clean architecture: dependencies only point inwards</text>
  <text x="30" y="64" font-size="13" fill="#64748b">Business rules in the centre know nothing about Spring, Redis, HTTP or React. Outer rings change for technical reasons, inner rings for business reasons.</text>

  <!-- ===== Backend ===== -->
  <g transform="translate(60 88)">
    <circle cx="14" cy="14" r="14" fill="#6db33f"/>
    <path d="M8 20 C8 10 14 7 22 7 C22 16 18 21 11 21 M8 20 L15 13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="98" y="108" class="hd">Backend · Spring Boot</text>

  <g>
    <circle cx="270" cy="350" r="222" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="270" cy="350" r="166" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="270" cy="350" r="110" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <circle cx="270" cy="350" r="56" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>

    <text x="270" y="152" class="rl" fill="#334155">config</text>
    <text x="270" y="168" class="re">composition root</text>
    <text x="270" y="538" class="re">UseCaseConfig · SecurityConfig</text>
    <text x="270" y="554" class="re">RateLimitConfig · DevUserSeeder</text>

    <text x="270" y="208" class="rl" fill="#1e40af">adapter</text>
    <text x="270" y="224" class="re">in · out · common</text>
    <text x="270" y="484" class="re">controllers · SSE · filter</text>
    <text x="270" y="500" class="re">Redis + Lua · BCrypt · GeoIP</text>

    <text x="270" y="264" class="rl" fill="#3730a3">application</text>
    <text x="270" y="280" class="re">use cases + ports</text>
    <text x="270" y="430" class="re">QrSessionService</text>
    <text x="270" y="446" class="re">QrSessionStore (port)</text>

    <text x="270" y="342" class="rl" fill="#7e22ce">domain</text>
    <text x="270" y="360" class="re">QrSession</text>
    <text x="270" y="375" class="re">User</text>
  </g>
  <path d="M52 350 L208 350" stroke="#0f172a" stroke-width="2.4" marker-end="url(#ad)"/>
  <text x="62" y="340" font-size="11.5" fill="#0f172a" font-weight="600">imports</text>

  <!-- ===== Frontend ===== -->
  <g transform="translate(560 88)" fill="none" stroke="#149eca" stroke-width="2">
    <ellipse cx="14" cy="14" rx="14" ry="5.5"/>
    <ellipse cx="14" cy="14" rx="14" ry="5.5" transform="rotate(60 14 14)"/>
    <ellipse cx="14" cy="14" rx="14" ry="5.5" transform="rotate(120 14 14)"/>
    <circle cx="14" cy="14" r="2.6" fill="#149eca" stroke="none"/>
  </g>
  <text x="598" y="108" class="hd">Frontend · React + TypeScript</text>

  <g>
    <circle cx="770" cy="350" r="222" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="770" cy="350" r="166" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="770" cy="350" r="110" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <circle cx="770" cy="350" r="56" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>

    <text x="770" y="152" class="rl" fill="#334155">app/</text>
    <text x="770" y="168" class="re">composition root, routes</text>
    <text x="770" y="538" class="re">DependenciesProvider</text>
    <text x="770" y="554" class="re">App (React Router)</text>

    <text x="770" y="208" class="rl" fill="#1e40af" style="font-size:12px">infrastructure/ + presentation/</text>
    <text x="770" y="224" class="re">I/O · UI</text>
    <text x="770" y="484" class="re">fetch · EventSource · camera</text>
    <text x="770" y="500" class="re">pages · components</text>

    <text x="770" y="264" class="rl" fill="#3730a3">application/</text>
    <text x="770" y="280" class="re">hooks + ports</text>
    <text x="770" y="430" class="re">useQrLogin</text>
    <text x="770" y="446" class="re">QrGateway (port)</text>

    <text x="770" y="342" class="rl" fill="#7e22ce">domain/</text>
    <text x="770" y="360" class="re">QrStatus</text>
    <text x="770" y="375" class="re">approveLink</text>
  </g>
  <path d="M552 350 L708 350" stroke="#0f172a" stroke-width="2.4" marker-end="url(#ad)"/>
  <text x="562" y="340" font-size="11.5" fill="#0f172a" font-weight="600">imports</text>

  <!-- enforcement -->
  <text x="270" y="598" class="ft">Enforced by ArchUnit: <tspan class="fm">CleanArchitectureTest</tspan> fails <tspan class="fm">mvnw test</tspan></text>
  <text x="770" y="598" class="ft">Enforced by oxlint <tspan class="fm">no-restricted-imports</tspan> in <tspan class="fm">bun run lint</tspan></text>
</svg>
