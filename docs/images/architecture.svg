<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="a-sse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1040" height="520" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">AdvancedLogin — system overview</text>

  <!-- Desktop -->
  <rect x="30" y="70" width="250" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Desktop browser</text>
  <text x="155" y="122" text-anchor="middle" font-size="13" fill="#1e40af">not logged in</text>
  <text x="155" y="146" text-anchor="middle" font-size="12" fill="#334155">React: /login, /</text>
  <text x="155" y="166" text-anchor="middle" font-size="12" fill="#334155">qrcode.react + EventSource</text>
  <text x="155" y="186" text-anchor="middle" font-size="11" fill="#64748b">cookie: qr_bind (HttpOnly)</text>

  <!-- Phone -->
  <rect x="30" y="320" width="250" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Phone browser</text>
  <text x="155" y="372" text-anchor="middle" font-size="13" fill="#166534">already logged in</text>
  <text x="155" y="396" text-anchor="middle" font-size="12" fill="#334155">React: /m/login, /m/scan,</text>
  <text x="155" y="416" text-anchor="middle" font-size="12" fill="#334155">/m/approve/:qrId</text>
  <text x="155" y="436" text-anchor="middle" font-size="11" fill="#64748b">cookie: SESSION (HttpOnly)</text>

  <!-- QR scan (out of band) -->
  <line x1="155" y1="202" x2="155" y2="316" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-gray)"/>
  <rect x="166" y="240" width="134" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="233" y="256" text-anchor="middle" font-size="11" fill="#475569">camera reads QR</text>
  <text x="233" y="271" text-anchor="middle" font-size="11" fill="#475569">(contains qrId URL)</text>

  <!-- Desktop <-> Backend -->
  <line x1="282" y1="115" x2="436" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="360" y="106" text-anchor="middle" font-size="12" fill="#334155">POST create, exchange</text>
  <line x1="438" y1="165" x2="284" y2="165" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a-sse)"/>
  <text x="360" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">SSE: status stream</text>

  <!-- Phone -> Backend -->
  <line x1="282" y1="385" x2="436" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#334155">POST login,</text>
  <text x="360" y="377" text-anchor="middle" font-size="12" fill="#334155">scan / approve / reject</text>

  <!-- Backend -->
  <rect x="440" y="60" width="290" height="410" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="585" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">Spring Boot backend</text>
  <rect x="460" y="102" width="250" height="36" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="125" text-anchor="middle" font-size="12" fill="#334155">Spring Security · CSRF · RateLimitFilter</text>
  <rect x="460" y="146" width="250" height="36" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="169" text-anchor="middle" font-size="12" fill="#334155">Spring Session (HTTP sessions in Redis)</text>
  <rect x="460" y="192" width="250" height="262" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-dasharray="4 3"/>
  <text x="475" y="212" font-size="12" font-weight="700" fill="#5b21b6">qr/ module</text>
  <rect x="475" y="222" width="220" height="32" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="243" text-anchor="middle" font-size="12" fill="#334155">QrDesktopController</text>
  <rect x="475" y="260" width="220" height="32" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="281" text-anchor="middle" font-size="12" fill="#334155">QrMobileController</text>
  <rect x="475" y="298" width="220" height="32" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="319" text-anchor="middle" font-size="12" fill="#334155">QrSessionService (rules)</text>
  <rect x="475" y="336" width="220" height="32" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="357" text-anchor="middle" font-size="12" fill="#334155">QrSessionStore (Lua CAS)</text>
  <rect x="475" y="374" width="220" height="32" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="585" y="395" text-anchor="middle" font-size="12" fill="#334155">QrEventBus (pub/sub)</text>
  <rect x="475" y="412" width="220" height="32" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="585" y="433" text-anchor="middle" font-size="12" fill="#9a3412">SseEmitterRegistry</text>

  <!-- Redis -->
  <rect x="810" y="60" width="200" height="410" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="910" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Redis</text>
  <rect x="825" y="110" width="170" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="910" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">rl:{bucket}:{ip}:{min}</text>
  <text x="910" y="154" text-anchor="middle" font-size="11" fill="#64748b">rate-limit counters</text>
  <rect x="825" y="200" width="170" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="910" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">spring:session:*</text>
  <text x="910" y="244" text-anchor="middle" font-size="11" fill="#64748b">HTTP sessions</text>
  <rect x="825" y="290" width="170" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="910" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">qr:s:{qrId}</text>
  <text x="910" y="334" text-anchor="middle" font-size="11" fill="#64748b">HASH + TTL (90/60/30s)</text>
  <rect x="825" y="380" width="170" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="910" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">qr:events:{qrId}</text>
  <text x="910" y="424" text-anchor="middle" font-size="11" fill="#64748b">Pub/Sub channel</text>

  <!-- Backend <-> Redis -->
  <line x1="712" y1="120" x2="821" y2="138" stroke="#334155" stroke-width="1.5" marker-start="url(#a-dark)" marker-end="url(#a-dark)"/>
  <line x1="712" y1="164" x2="821" y2="228" stroke="#334155" stroke-width="1.5" marker-start="url(#a-dark)" marker-end="url(#a-dark)"/>
  <line x1="697" y1="352" x2="821" y2="318" stroke="#334155" stroke-width="1.5" marker-start="url(#a-dark)" marker-end="url(#a-dark)"/>
  <line x1="697" y1="390" x2="821" y2="408" stroke="#334155" stroke-width="1.5" marker-start="url(#a-dark)" marker-end="url(#a-dark)"/>

  <!-- Legend -->
  <line x1="30" y1="495" x2="70" y2="495" stroke="#334155" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="78" y="499" font-size="12" fill="#475569">HTTP request</text>
  <line x1="180" y1="495" x2="220" y2="495" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a-sse)"/>
  <text x="228" y="499" font-size="12" fill="#475569">server push (SSE)</text>
  <line x1="360" y1="495" x2="400" y2="495" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-gray)"/>
  <text x="408" y="499" font-size="12" fill="#475569">offline (camera, no network)</text>
  <text x="1010" y="499" text-anchor="end" font-size="12" fill="#475569">Dev: Vite proxies /api → Spring, so one origin (no CORS)</text>
</svg>
