<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 680" width="1130" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AdvancedLogin system overview</title>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc382d"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    .t { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 12px; fill: #64748b; }
    .b { font-size: 12.5px; fill: #1e293b; }
    .h { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .x { font-size: 11px; fill: #475569; }
    .m { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #0f172a; }
    .mb { font-family: Consolas, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #991b1b; }
  </style>

  <rect x="1" y="1" width="1128" height="678" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">AdvancedLogin — system overview</text>
  <text x="30" y="64" font-size="13" fill="#64748b">The browsers only talk to Vite; Vite proxies /api to Spring Boot (one origin: no CORS, cookies just work). Redis holds all shared, expiring state.</text>

  <!-- ============ Desktop ============ -->
  <rect x="30" y="92" width="240" height="210" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <g transform="translate(46 106)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round">
    <rect x="0" y="0" width="36" height="25" rx="3"/>
    <path d="M12 32 h12 M18 25 v7"/>
  </g>
  <text x="94" y="118" class="t">Desktop browser</text>
  <text x="94" y="136" class="s">not signed in yet</text>
  <text x="46" y="172" class="b">route <tspan class="m">/</tspan></text>
  <text x="46" y="192" class="b">QR code (qrcode.react)</text>
  <text x="46" y="212" class="b">EventSource: live status</text>
  <text x="46" y="232" class="b">polling as fallback</text>
  <rect x="46" y="250" width="150" height="24" rx="12" fill="#ffffff" stroke="#2563eb"/>
  <text x="121" y="266" class="m" text-anchor="middle">qr_bind (HttpOnly)</text>
  <!-- mini QR -->
  <g transform="translate(206 160)">
    <rect width="48" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <g fill="#0f172a">
      <rect x="5" y="5" width="13" height="13"/><rect x="30" y="5" width="13" height="13"/><rect x="5" y="30" width="13" height="13"/>
      <rect x="22" y="9" width="4" height="4"/><rect x="22" y="22" width="4" height="4"/><rect x="30" y="26" width="4" height="4"/>
      <rect x="38" y="34" width="5" height="5"/><rect x="26" y="38" width="5" height="5"/><rect x="9" y="22" width="4" height="4"/>
    </g>
    <g fill="#ffffff"><rect x="8" y="8" width="7" height="7"/><rect x="33" y="8" width="7" height="7"/><rect x="8" y="33" width="7" height="7"/></g>
    <g fill="#0f172a"><rect x="10" y="10" width="3" height="3"/><rect x="35" y="10" width="3" height="3"/><rect x="10" y="35" width="3" height="3"/></g>
  </g>

  <!-- ============ Phone ============ -->
  <rect x="30" y="392" width="240" height="220" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(52 404)" fill="none" stroke="#16a34a" stroke-width="2.5">
    <rect x="0" y="0" width="22" height="36" rx="5"/>
    <path d="M8 31 h6"/>
  </g>
  <text x="94" y="418" class="t">Phone browser</text>
  <text x="94" y="436" class="s">already signed in (alice)</text>
  <text x="46" y="472" class="b"><tspan class="m">/m/login</tspan>  password, once</text>
  <text x="46" y="492" class="b"><tspan class="m">/m/scan</tspan>  camera + ZXing wasm</text>
  <text x="46" y="512" class="b"><tspan class="m">/m/approve/:qrId</tspan></text>
  <text x="46" y="532" class="b">shows device, IP, place → Approve</text>
  <rect x="46" y="562" width="150" height="24" rx="12" fill="#ffffff" stroke="#16a34a"/>
  <text x="121" y="578" class="m" text-anchor="middle">SESSION (HttpOnly)</text>

  <!-- camera, offline -->
  <path d="M150 390 L150 306" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ag)"/>
  <text x="160" y="342" class="x">camera reads the QR</text>
  <text x="160" y="357" class="x">(no network involved)</text>

  <!-- ============ Vite ============ -->
  <rect x="350" y="262" width="180" height="168" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <path d="M376 276 l-12 22 h10 l-4 18 l16 -24 h-10 l6 -16 z" fill="#8b5cf6"/>
  <text x="400" y="290" class="t">Vite dev server</text>
  <text x="400" y="308" class="s">:5173 · run with bun</text>
  <text x="366" y="340" class="b">serves the React app</text>
  <text x="366" y="360" class="b">proxies <tspan class="m">/api</tspan> → :8080</text>
  <text x="366" y="380" class="b">adds X-Forwarded-For</text>
  <text x="366" y="400" class="b"><tspan class="m">dev:lan</tspan> → HTTPS on LAN</text>

  <!-- browser <-> vite -->
  <path d="M270 200 L352 288" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>
  <path d="M350 306 L272 222" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <path d="M270 490 L352 412" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>

  <!-- vite <-> spring -->
  <path d="M530 334 L566 334" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>
  <path d="M570 354 L534 354" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="550" y="324" class="m" text-anchor="middle">/api</text>

  <!-- ============ Spring Boot ============ -->
  <rect x="570" y="92" width="330" height="540" rx="14" fill="#f7fee7" stroke="#6db33f" stroke-width="1.5"/>
  <g transform="translate(588 104)">
    <circle cx="16" cy="16" r="16" fill="#6db33f"/>
    <path d="M9 23 C9 12 16 8 25 8 C25 18 20 24 12 24 M9 23 L17 15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="630" y="118" class="t">Spring Boot API</text>
  <text x="630" y="136" class="s">:8080 · Java 21 · Spring Security 7 · Lettuce</text>

  <g>
    <rect x="588" y="152" width="294" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="152" width="6" height="44" rx="3" fill="#f59e0b"/>
    <text x="604" y="170" class="h">RateLimitFilter</text>
    <text x="604" y="187" class="x">per-IP limits, runs before security → 429</text>

    <rect x="588" y="204" width="294" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="204" width="6" height="44" rx="3" fill="#64748b"/>
    <text x="604" y="222" class="h">Spring Security + Spring Session</text>
    <text x="604" y="239" class="x">CSRF (XSRF-TOKEN) · SESSION cookie · /m/* needs login</text>

    <rect x="588" y="256" width="294" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="256" width="6" height="62" rx="3" fill="#2563eb"/>
    <text x="604" y="274" class="h">Controllers <tspan class="x">adapter/in/web</tspan></text>
    <text x="604" y="292" class="x">QrDesktopController · QrMobileController</text>
    <text x="604" y="308" class="x">AuthController · QrStatusStreams (SSE)</text>

    <rect x="588" y="326" width="294" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="326" width="6" height="62" rx="3" fill="#4f46e5"/>
    <text x="604" y="344" class="h">Use cases <tspan class="x">application</tspan></text>
    <text x="604" y="362" class="x">CreateQrSessionService · QrSessionService</text>
    <text x="604" y="378" class="x">AuthenticateUserService · RateLimitService</text>

    <rect x="588" y="396" width="294" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="396" width="6" height="44" rx="3" fill="#a855f7"/>
    <text x="604" y="414" class="h">Domain <tspan class="x">plain Java</tspan></text>
    <text x="604" y="431" class="x">QrSession state machine · User</text>

    <rect x="588" y="448" width="294" height="78" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="448" width="6" height="78" rx="3" fill="#dc382d"/>
    <text x="604" y="466" class="h">Redis adapters <tspan class="x">adapter/out, adapter/in/redis</tspan></text>
    <text x="604" y="484" class="x">RedisQrSessionStore (Lua compare-and-set)</text>
    <text x="604" y="500" class="x">RedisQrStatusPublisher · RedisRateLimiter</text>
    <text x="604" y="516" class="x">RedisQrEventSubscriber → QrStatusStreams</text>

    <rect x="588" y="534" width="294" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="588" y="534" width="6" height="44" rx="3" fill="#0d9488"/>
    <text x="604" y="552" class="h">GeoIpLocationLookup</text>
    <text x="604" y="569" class="x">IP → "City, Country", LAN → "Local network"</text>
  </g>
  <text x="588" y="608" class="x" font-style="italic">config/UseCaseConfig wires use cases to adapters</text>

  <!-- ============ Redis ============ -->
  <rect x="936" y="92" width="180" height="360" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <g transform="translate(950 106)">
    <path d="M0 8 L16 0 L32 8 L16 16 z" fill="#dc382d"/>
    <path d="M0 16 L16 24 L32 16" fill="none" stroke="#dc382d" stroke-width="3"/>
    <path d="M0 24 L16 32 L32 24" fill="none" stroke="#dc382d" stroke-width="3"/>
  </g>
  <text x="992" y="120" class="t">Redis 8</text>
  <text x="992" y="137" class="s">Docker, 127.0.0.1</text>

  <rect x="946" y="156" width="160" height="50" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="956" y="176" class="mb">rl:{rule}:{subject}</text>
  <text x="956" y="194" class="x">rate-limit counters</text>
  <rect x="946" y="214" width="160" height="50" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="956" y="234" class="mb" style="font-size:10px">advancedlogin:session:*</text>
  <text x="956" y="252" class="x">HTTP sessions · 30 min idle</text>
  <rect x="946" y="272" width="160" height="50" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="956" y="292" class="mb">qr:s:{qrId}</text>
  <text x="956" y="310" class="x">HASH · TTL 90/60/30/15 s</text>
  <rect x="946" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="956" y="350" class="mb">qr:events:{qrId}</text>
  <text x="956" y="368" class="x">Pub/Sub channel</text>
  <text x="950" y="404" class="x">Lua scripts run atomically:</text>
  <text x="950" y="420" class="x">create, compare-and-set,</text>
  <text x="950" y="436" class="x">rate-limit counter</text>

  <!-- spring <-> redis -->
  <path d="M882 174 C 912 174, 912 181, 942 181" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>
  <path d="M882 226 C 912 226, 912 239, 942 239" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>
  <path d="M882 462 C 905 462, 905 297, 942 297" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>
  <path d="M946 355 C 926 355, 926 516, 886 516" stroke="#dc382d" stroke-width="2.2" stroke-dasharray="7 4" fill="none" marker-end="url(#ar)"/>

  <!-- ============ GeoIP file ============ -->
  <rect x="936" y="520" width="180" height="78" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <g transform="translate(950 534)" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linejoin="round">
    <path d="M0 0 h16 l8 8 v24 h-24 z M16 0 v8 h8"/>
  </g>
  <text x="984" y="548" class="h">.mmdb file</text>
  <text x="984" y="565" class="x">optional, offline</text>
  <text x="950" y="586" class="x">GeoLite2 / DB-IP City</text>
  <path d="M882 556 L932 556" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ad)"/>

  <!-- ============ legend ============ -->
  <g transform="translate(30 648)" font-size="12" fill="#334155">
    <path d="M0 0 h34" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><text x="44" y="4">HTTP request / call</text>
    <path d="M190 0 h34" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/><text x="234" y="4">server push (SSE stream to the desktop)</text>
    <path d="M490 0 h34" stroke="#dc382d" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#ar)"/><text x="534" y="4">Redis Pub/Sub message (PSUBSCRIBE qr:events:*)</text>
    <path d="M840 0 h34" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/><text x="884" y="4">offline (camera)</text>
  </g>
</svg>
