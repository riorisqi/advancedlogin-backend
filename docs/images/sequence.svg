<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1324" width="1040" height="1324" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>QR login, full sequence</title>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <style>
    .ph { font-size: 13.5px; font-weight: 700; fill: #4f46e5; }
    .lb { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #0f172a; }
    .ls { font-size: 11.5px; fill: #64748b; }
    .nr { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #991b1b; }
    .nu { font-size: 11.5px; fill: #334155; font-style: italic; }
    .nd { font-size: 12px; fill: #166534; font-weight: 700; }
    .hd { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .hs { font-size: 12px; fill: #64748b; }
  </style>
  <rect x="1" y="1" width="1038" height="1322" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">QR login, full sequence</text>
  <text x="30" y="60" font-size="13" fill="#64748b">The phone vouches with its own session; the desktop never sees a password or the phone's cookie, only a one-time code.</text>
  <rect x="20" y="160" width="1000" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="34" y="182" class="ph">1 · The desktop asks for a QR code and starts listening</text><rect x="20" y="456" width="1000" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="478" class="ph">2 · The phone scans</text><rect x="20" y="758" width="1000" height="168" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="34" y="780" class="ph">3 · The user approves</text><rect x="20" y="936" width="1000" height="308" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="34" y="958" class="ph">4 · The desktop trades the code for its own session</text>
  <path d="M170 132 L170 1254" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M520 132 L520 1254" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M870 132 L870 1254" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 5"/>
  <!-- headers -->
  <rect x="60" y="78" width="220" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <g transform="translate(78 92)" fill="none" stroke="#2563eb" stroke-width="2.2"><rect width="30" height="20" rx="3"/><path d="M10 26 h10 M15 20 v6"/></g>
  <text x="122" y="102" class="hd" text-anchor="start">Desktop browser</text>
  <text x="122" y="120" class="hs" text-anchor="start">not signed in</text>
  <rect x="400" y="78" width="240" height="54" rx="12" fill="#f7fee7" stroke="#6db33f" stroke-width="1.5"/>
  <g transform="translate(416 90)"><circle cx="14" cy="14" r="14" fill="#6db33f"/><path d="M8 20 C8 10 14 7 22 7 C22 16 18 21 11 21 M8 20 L15 13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="454" y="102" class="hd" text-anchor="start">Backend + Redis</text>
  <text x="454" y="120" class="hs" text-anchor="start">Spring Boot :8080</text>
  <rect x="760" y="78" width="220" height="54" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(782 88)" fill="none" stroke="#16a34a" stroke-width="2.2"><rect width="18" height="30" rx="4"/><path d="M6 25 h6"/></g>
  <text x="816" y="102" class="hd" text-anchor="start">Phone browser</text>
  <text x="816" y="120" class="hs" text-anchor="start">signed in as alice</text>
  <text x="345.0" y="204" class="lb" text-anchor="middle">POST /api/qr/sessions</text><text x="345.0" y="220" class="ls" text-anchor="middle">(anonymous, CSRF header)</text><path d="M174 228 L516 228" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><rect x="284" y="246" width="472" height="24" rx="7" fill="#fef2f2" stroke="#fca5a5"/><text x="520.0" y="262" class="nr" text-anchor="middle">qr_create.lua: HSET qr:s:{id} status=PENDING bindHash=… + PEXPIRE 90 s</text><text x="345.0" y="290" class="lb" text-anchor="middle">201 {qrId, qrContent, expiresAt}</text><text x="345.0" y="306" class="ls" text-anchor="middle">+ Set-Cookie qr_bind (HttpOnly, SameSite=Strict)</text><path d="M516 314 L174 314" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ad)"/><text x="345.0" y="338" class="lb" text-anchor="middle">GET …/{id}/events</text><text x="345.0" y="354" class="ls" text-anchor="middle">(EventSource, browser sends qr_bind)</text><path d="M174 362 L516 362" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><text x="345.0" y="386" class="lb" text-anchor="middle">SSE status: PENDING</text><path d="M516 394 L174 394" stroke="#ea580c" stroke-width="2.6" marker-end="url(#ao)"/><rect x="81" y="412" width="178" height="24" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="170.0" y="428" class="nu" text-anchor="middle">draws the QR + countdown</text><rect x="736" y="494" width="267" height="24" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="870.0" y="510" class="nu" text-anchor="middle">camera reads the QR → parseApproveLink</text><text x="695.0" y="538" class="lb" text-anchor="middle">POST …/{id}/scan</text><text x="695.0" y="554" class="ls" text-anchor="middle">(SESSION cookie + CSRF)</text><path d="M866 562 L524 562" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><rect x="310" y="580" width="421" height="24" rx="7" fill="#fef2f2" stroke="#fca5a5"/><text x="520.0" y="596" class="nr" text-anchor="middle">CAS PENDING → SCANNED · scannedBy = alice · TTL 60 s · PUBLISH</text><text x="695.0" y="624" class="lb" text-anchor="middle">200 {browser, os, ipAddress,</text><text x="695.0" y="640" class="ls" text-anchor="middle">approximateLocation, requestedAt}</text><path d="M524 648 L866 648" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ad)"/><text x="345.0" y="672" class="lb" text-anchor="middle">SSE status: SCANNED</text><text x="345.0" y="688" class="ls" text-anchor="middle">(Redis Pub/Sub → this stream)</text><path d="M516 696 L174 696" stroke="#ea580c" stroke-width="2.6" marker-end="url(#ao)"/><rect x="56" y="714" width="229" height="24" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="170.0" y="730" class="nu" text-anchor="middle">&quot;Scanned: confirm on your phone&quot;</text><rect x="765" y="714" width="210" height="24" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="870.0" y="730" class="nu" text-anchor="middle">user checks device, IP, place</text><text x="695.0" y="802" class="lb" text-anchor="middle">POST …/{id}/approve</text><path d="M866 810 L524 810" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><rect x="278" y="828" width="485" height="24" rx="7" fill="#fef2f2" stroke="#fca5a5"/><text x="520.0" y="844" class="nr" text-anchor="middle">new 256-bit exchange code · CAS SCANNED → CONFIRMED · TTL 30 s · PUBLISH</text><text x="695.0" y="872" class="lb" text-anchor="middle">204 No Content</text><path d="M524 880 L866 880" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ad)"/><text x="345.0" y="904" class="lb" text-anchor="middle">SSE status: CONFIRMED {exchangeCode}</text><path d="M516 912 L174 912" stroke="#ea580c" stroke-width="2.6" marker-end="url(#ao)"/><text x="345.0" y="980" class="lb" text-anchor="middle">POST …/{id}/exchange {code}</text><text x="345.0" y="996" class="ls" text-anchor="middle">+ qr_bind cookie + CSRF header</text><path d="M174 1004 L516 1004" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><rect x="268" y="1022" width="504" height="24" rx="7" fill="#fef2f2" stroke="#fca5a5"/><text x="520.0" y="1038" class="nr" text-anchor="middle">binding matches · code compared in constant time · CAS CONFIRMED → CONSUMED</text><text x="345.0" y="1066" class="lb" text-anchor="middle">200 {id, username, displayName}</text><text x="345.0" y="1082" class="ls" text-anchor="middle">Set-Cookie SESSION (new id) · new XSRF-TOKEN · qr_bind cleared</text><path d="M516 1090 L174 1090" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ad)"/><text x="345.0" y="1114" class="lb" text-anchor="middle">SSE status: CONSUMED, stream closes</text><path d="M516 1122 L174 1122" stroke="#ea580c" stroke-width="2.6" marker-end="url(#ao)"/><text x="345.0" y="1146" class="lb" text-anchor="middle">GET /api/me</text><path d="M174 1154 L516 1154" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><text x="345.0" y="1178" class="lb" text-anchor="middle">200 alice</text><path d="M516 1186 L174 1186" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ad)"/><rect x="62" y="1204" width="216" height="24" rx="7" fill="#dcfce7" stroke="#22c55e"/><text x="170.0" y="1220" class="nd" text-anchor="middle">signed in: &quot;Welcome, Alice&quot;  ✓</text>
  <g transform="translate(34 1288)" font-size="12" fill="#334155">
    <path d="M0 0 h34" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/><text x="42" y="4">request</text>
    <path d="M120 0 h34" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ad)"/><text x="162" y="4">response</text>
    <path d="M250 0 h34" stroke="#ea580c" stroke-width="2.6" marker-end="url(#ao)"/><text x="292" y="4">SSE push</text>
    <rect x="380" y="-10" width="30" height="18" rx="5" fill="#fef2f2" stroke="#fca5a5"/><text x="418" y="4">atomic Redis step (Lua)</text>
    <rect x="590" y="-10" width="30" height="18" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="628" y="4">what the user sees / does</text>
    <text x="830" y="4" fill="#64748b">Paths: …/{id} = /api/qr/sessions/{id}</text>
  </g>
</svg>
