spring:
  application:
    name: advancedlogin
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}   # dev default lives in application-dev.yml
      # fail fast instead of the 60s default
      timeout: 2s
      connect-timeout: 2s
  session:
    timeout: 30m
    data:
      redis:
        namespace: advancedlogin:session

server:
  port: 8080
  # Trust X-Forwarded-For only from local/private proxies (e.g. the Vite dev proxy).
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: false       # true behind HTTPS

app:
  # Optional MaxMind-format .mmdb (GeoLite2-City, DB-IP City Lite) for public-IP locations.
  geoip:
    database: ${APP_GEOIP_DATABASE:}

  # *-ip rules are per client IP; login-user is per username, from any IP.
  rate-limit:
    enabled: true
    rules:
      qr-create:   { requests: 10, window: 1m }
      qr-status:   { requests: 60, window: 1m }   # polls + SSE (re)connects
      qr-exchange: { requests: 10, window: 1m }
      login-ip:    { requests: 20, window: 1m }
      login-user:  { requests: 5,  window: 1m }

  qr:
    timeouts:          # each transition restarts the clock
      pending: 90s
      scanned: 60s
      confirmed: 30s
      terminal: 15s    # how long REJECTED/CONSUMED stay visible
    # Base of the URL inside the QR. Empty = the desktop's Origin (see ApproveLinks); set it in production.
    approve-base-url: ${APP_QR_APPROVE_BASE_URL:}
    secure-cookies: false   # true behind HTTPS
